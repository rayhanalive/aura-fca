<svg width="1200" height="420" viewBox="0 0 1200 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">MAHMUD AURA FCA</title>
  <desc id="desc">Masterpiece Facebook Chat API banner featuring Mahmud Aura FCA branding with high-tech neon styling.</desc>
  <defs>
    <!-- Deep Masterpiece Cyber Gradient Background -->
    <linearGradient id="background" x1="0" y1="0" x2="1200" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#040209"/>
      <stop offset="0.5" stop-color="#120722"/>
      <stop offset="1" stop-color="#020914"/>
    </linearGradient>

    <!-- Masterpiece Electric Accent Gradient -->
    <linearGradient id="accent" x1="180" y1="70" x2="1020" y2="350" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FF2A85"/>
      <stop offset="0.45" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#00F0FF"/>
    </linearGradient>

    <!-- Radial Glowing Orbs -->
    <radialGradient id="glow-magenta">
      <stop stop-color="#FF2A85" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#FF2A85" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-cyan">
      <stop stop-color="#00F0FF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#00F0FF" stop-opacity="0"/>
    </radialGradient>

    <filter id="blur" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="35"/>
    </filter>
    
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" stroke="#00F0FF" stroke-opacity="0.04"/>
    </pattern>
  </defs>

  <!-- Base Elements -->
  <rect width="1200" height="420" rx="32" fill="url(#background)"/>
  <rect width="1200" height="420" rx="32" fill="url(#grid)"/>

  <!-- Dynamic Glowing Background Orbs -->
  <circle cx="180" cy="90" r="170" fill="url(#glow-magenta)" filter="url(#blur)">
    <animate attributeName="cx" values="180;250;180" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="90;130;90" dur="8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1020" cy="330" r="200" fill="url(#glow-cyan)" filter="url(#blur)">
    <animate attributeName="cx" values="1020;930;1020" dur="10s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="330;280;330" dur="10s" repeatCount="indefinite"/>
  </circle>

  <!-- Animated Neon Wave Curves & Pulses -->
  <g opacity="0.9">
    <path d="M60 320C220 220 280 380 430 300C580 220 620 340 780 260C940 180 980 290 1140 190" stroke="url(#accent)" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="12 16">
      <animate attributeName="stroke-dashoffset" from="0" to="-240" dur="6s" repeatCount="indefinite"/>
    </path>
    <circle cx="430" cy="300" r="6" fill="#8B5CF6">
      <animate attributeName="r" values="4;10;4" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.2;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="780" cy="260" r="6" fill="#00F0FF">
      <animate attributeName="r" values="4;10;4" dur="2.2s" begin="0.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.2;1" dur="2.2s" begin="0.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Floating Messenger Icon / Box -->
  <g filter="url(#shadow)">
    <rect x="86" y="88" width="74" height="74" rx="22" fill="#FFFFFF" fill-opacity="0.05" stroke="url(#accent)" stroke-width="1.5"/>
    <!-- Messenger bubble vector path -->
    <path d="M123 104C111.4 104 102 112.9 102 123.9C102 129.8 104.8 135.1 109.2 138.7V146L116.3 142.2C118.4 142.8 120.6 143.1 123 143.1C134.6 143.1 144 134.2 144 123.2C144 112.2 134.6 104 123 104ZM127.3 131.6L116.7 120.4L95.5 131.6L119 106.9L129.6 118.1L150.8 106.9L127.3 131.6Z" fill="url(#accent)" transform="translate(-16 -3) scale(1.1)"/>
  </g>

  <!-- Typography & Masterpiece Branding -->
  <text x="86" y="238" fill="white" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="64" font-weight="900" letter-spacing="5">MAHMUD AURA FCA</text>
  <text x="92" y="278" fill="#F3E8FF" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" letter-spacing="4">MASTERPIECE FACEBOOK CHAT API</text>
  
  <!-- Pulsing Progress Bar -->
  <rect x="92" y="306" width="160" height="4" rx="2" fill="url(#accent)">
    <animate attributeName="width" values="90;240;90" dur="3s" repeatCount="indefinite"/>
  </rect>
</svg>
