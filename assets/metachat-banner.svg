<svg width="1200" height="420" viewBox="0 0 1200 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">MAHMUD AURA</title>
  <desc id="desc">Complete animated cyberpunk neon gradient banner for Mahmud Aura development and automation.</desc>
  <defs>
    <!-- Rich Cyberpunk / Aura Gradient Background -->
    <linearGradient id="background" x1="0" y1="0" x2="1200" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#05030A"/>
      <stop offset="0.5" stop-color="#1A0B2E"/>
      <stop offset="1" stop-color="#030E18"/>
    </linearGradient>

    <!-- Vibrant Electric Aura Accent Gradient -->
    <linearGradient id="accent" x1="200" y1="80" x2="1000" y2="340" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FF2A85"/>
      <stop offset="0.45" stop-color="#9D4EDD"/>
      <stop offset="1" stop-color="#00F0FF"/>
    </linearGradient>

    <!-- Deep Glowing Orbs -->
    <radialGradient id="glow-magenta">
      <stop stop-color="#FF2A85" stop-opacity="0.65"/>
      <stop offset="1" stop-color="#FF2A85" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-cyan">
      <stop stop-color="#00F0FF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#00F0FF" stop-opacity="0"/>
    </radialGradient>

    <filter id="blur" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="35"/>
    </filter>
    
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" stroke="#FF2A85" stroke-opacity="0.05"/>
    </pattern>
  </defs>

  <!-- Base Elements -->
  <rect width="1200" height="420" rx="32" fill="url(#background)"/>
  <rect width="1200" height="420" rx="32" fill="url(#grid)"/>

  <!-- Dynamic Glowing Background Orbs -->
  <circle cx="180" cy="90" r="170" fill="url(#glow-magenta)" filter="url(#blur)">
    <animate attributeName="cx" values="180;260;180" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="90;140;90" dur="8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1020" cy="330" r="200" fill="url(#glow-cyan)" filter="url(#blur)">
    <animate attributeName="cx" values="1020;920;1020" dur="10s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="330;270;330" dur="10s" repeatCount="indefinite"/>
  </circle>

  <!-- Animated Neon Wave Curves & Pulses -->
  <g opacity="0.9">
    <path d="M60 320C220 220 280 380 430 300C580 220 620 340 780 260C940 180 980 290 1140 190" stroke="url(#accent)" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="12 16">
      <animate attributeName="stroke-dashoffset" from="0" to="-240" dur="6s" repeatCount="indefinite"/>
    </path>
    <circle cx="430" cy="300" r="6" fill="#9D4EDD">
      <animate attributeName="r" values="4;10;4" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.2;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="780" cy="260" r="6" fill="#00F0FF">
      <animate attributeName="r" values="4;10;4" dur="2.2s" begin="0.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.2;1" dur="2.2s" begin="0.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Floating Glowing Icon Box -->
  <g filter="url(#shadow)">
    <rect x="86" y="88" width="74" height="74" rx="22" fill="#FFFFFF" fill-opacity="0.05" stroke="url(#accent)" stroke-width="1.5"/>
    <path d="M110 135V115C110 111.134 113.134 108 117 108H131C134.866 108 138 111.134 138 115V127C138 130.866 134.866 134 131 134H122L110 142V135Z" stroke="url(#accent)" stroke-width="3" stroke-linejoin="round"/>
    <circle cx="118" cy="121" r="3" fill="#FF2A85"/>
    <circle cx="124" cy="121" r="3" fill="#9D4EDD"/>
    <circle cx="130" cy="121" r="3" fill="#00F0FF"/>
  </g>

  <!-- Typography & Glow Text -->
  <text x="86" y="238" fill="white" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="72" font-weight="900" letter-spacing="6">MAHMUD AURA</text>
  <text x="92" y="278" fill="#F3E8FF" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" letter-spacing="5">DEVELOPER &amp; AUTOMATION CORE</text>
  
  <!-- Pulsing Progress Bar -->
  <rect x="92" y="306" width="140" height="4" rx="2" fill="url(#accent)">
    <animate attributeName="width" values="80;220;80" dur="3s" repeatCount="indefinite"/>
  </rect>
</svg>
